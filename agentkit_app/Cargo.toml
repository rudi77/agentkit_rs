[package]
name = "agentkit-app"
version = "0.14.0"
edition = "2021"
rust-version = "1.75"
description = "Die installierbare agentkit-Executable: CLI/REPL/TUI plus dynamische Agenten-Schwärme"
license = "MIT"

# Warum es dieses Crate gibt: `agentkit-swarm` hängt von `agentkit` ab, und das
# Binary braucht beide. Läge es weiter in agent_framework_rs, wäre das ein
# Cargo-Paketzyklus. Also: die Bibliotheken bleiben einbahnig, und nur dieses
# dünne Crate kennt beide. Die Agenten-Logik liegt weiterhin in den Bibliotheken
# (`agentkit::cli`, `agentkit::app`, `agentkit::tui`, `agentkit_swarm::dynamic`);
# hier bleibt die Shell des Executables: Argument-Parsing und der REPL.
[dependencies]
agentkit = { path = "../agent_framework_rs", default-features = false }
agentkit-swarm = { path = "../agentkit_swarm", default-features = false }
# Wissensgraph (`--graph DIR`) — optional, ohne eigene Speicher-Dependency.
agentkit-graph = { path = "../agentkit_graph", default-features = false, optional = true }
serde_json = "1"
# Kooperativer Ctrl-C-Abbruch (Stop-Knopf) im CLI.
ctrlc = "3"
# Zeileneditor des REPL (History, Ctrl-R, readline-Kürzel). `with-file-history`
# ist bewusst drin: es bringt die Dateisperre mit, ohne die sich zwei parallele
# REPLs die gemeinsame History in ~/.agentkit gegenseitig überschreiben. Die
# übrigen Features bleiben aus (kein custom-bindings, kein with-dirs).
rustyline = { version = "17", default-features = false, features = ["with-file-history"] }

[features]
default = ["openai"]
# Echter LLM-Pfad (Azure/OpenAI). Wird an beide Bibliotheken durchgereicht.
openai = ["agentkit/openai", "agentkit-swarm/openai"]
# Interaktives Terminal-UI (`agentkit --tui`, Binary `tui`).
tui = ["agentkit/tui"]
# `read_pdf`-Tool + `agentkit read-pdf`.
pdf = ["agentkit/pdf"]
# Context-Management über ctxman (`--ctx DIR`).
ctxman = ["agentkit/ctxman", "agentkit-swarm/ctxman"]
# Wissensgraph + Langzeitgedächtnis (`--graph DIR`): graph_search/-remember/-promote.
graph = ["dep:agentkit-graph"]
# Provider-genaue Token-Zählung für ctxman.
tiktoken = ["ctxman", "agentkit/tiktoken"]

# KEIN `panic = "abort"` (anders als agentkits eigenes Profil, das ~1 MB spart):
# der Schwarm-Supervisor erkennt Actor-Panics über Thread-Unwinding
# (`JoinHandle::join` liefert `Err`). Mit `abort` würde ein einzelner
# Actor-Panic den ganzen Prozess reißen, statt nur den Schwarm zu beenden.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"

# Nur die gemeinsame Verdrahtung beider Binaries (swarm-Tool + Prompt-Fragment).
[lib]
name = "agentkit_app"
path = "src/lib.rs"

# Die installierbare Haupt-Executable (CLI + optional TUI).
[[bin]]
name = "agentkit"
path = "src/bin/agentkit.rs"

# Interaktives Terminal-UI. Baut nur mit Feature `tui` (sonst fehlt ratatui).
[[bin]]
name = "tui"
path = "src/bin/tui.rs"
required-features = ["tui"]
