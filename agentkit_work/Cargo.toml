[package]
name = "agentkit-work"
version = "0.14.0"
edition = "2021"
rust-version = "1.75"
description = "Arbeits-Runtime für agentkit — persistente Work Items, Journal und Store, die einen einzelnen Agent-Lauf überleben"
license = "MIT"

[lib]
name = "agentkit_work"
path = "src/lib.rs"

[dependencies]
agentkit = { path = "../agent_framework_rs", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Offline-Default wie in agentkit_graph/agentkit_swarm: `cargo test` läuft ohne HTTP/TLS.
default = []
openai = ["agentkit/openai"]
ctxman = ["agentkit/ctxman"]
