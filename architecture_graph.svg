<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1120" viewBox="0 0 1700 1120">
  <defs>
    <style>
      .bg { fill: #0b1020; }
      .node { fill: #16213a; stroke: #7aa2f7; stroke-width: 2; rx: 14; ry: 14; }
      .node-core { fill: #1b2a4a; stroke: #9ece6a; }
      .node-optional { fill: #1a2440; stroke: #f7768e; }
      .label { fill: #e5e9f0; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 600; }
      .small { fill: #c0caf5; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 13px; }
      .edge { stroke: #c0caf5; stroke-width: 2.2; fill: none; marker-end: url(#arrow); opacity: 0.9; }
      .edge-dashed { stroke-dasharray: 7 5; }
      .edge-soft { stroke: #7dcfff; }
      .group-title { fill: #9ece6a; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: .04em; }
      .legend { fill: #e5e9f0; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 14px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0caf5" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1700" height="1120" />

  <!-- Groups -->
  <text class="group-title" x="80" y="70">CORE</text>
  <text class="group-title" x="670" y="70">INTEGRATION / APP</text>
  <text class="group-title" x="1240" y="70">ADAPTERS</text>

  <!-- Left column nodes -->
  <rect class="node node-core" x="70" y="120" width="300" height="92" rx="14" ry="14" />
  <text class="label" x="220" y="155" text-anchor="middle">agentkit</text>
  <text class="small" x="220" y="180" text-anchor="middle">agent_framework_rs</text>

  <rect class="node" x="70" y="250" width="300" height="92" rx="14" ry="14" />
  <text class="label" x="220" y="285" text-anchor="middle">ctxman</text>
  <text class="small" x="220" y="310" text-anchor="middle">ctxman_rs</text>

  <rect class="node node-optional" x="70" y="380" width="300" height="92" rx="14" ry="14" />
  <text class="label" x="220" y="415" text-anchor="middle">agentkit-graph</text>
  <text class="small" x="220" y="440" text-anchor="middle">knowledge / provenance</text>

  <rect class="node node-optional" x="70" y="510" width="300" height="92" rx="14" ry="14" />
  <text class="label" x="220" y="545" text-anchor="middle">agentkit-swarm</text>
  <text class="small" x="220" y="570" text-anchor="middle">multi-agent actor swarm</text>

  <rect class="node node-optional" x="70" y="640" width="300" height="92" rx="14" ry="14" />
  <text class="label" x="220" y="675" text-anchor="middle">agentkit-work</text>
  <text class="small" x="220" y="700" text-anchor="middle">persistent work runtime</text>

  <rect class="node node-optional" x="70" y="770" width="300" height="92" rx="14" ry="14" />
  <text class="label" x="220" y="805" text-anchor="middle">agentkit-viz</text>
  <text class="small" x="220" y="830" text-anchor="middle">trace viewer / browser UI</text>

  <!-- App node moved to the center-left, with clear routing corridors -->
  <rect class="node node-core" x="610" y="230" width="340" height="110" rx="14" ry="14" />
  <text class="label" x="780" y="270" text-anchor="middle">agentkit-app</text>
  <text class="small" x="780" y="294" text-anchor="middle">CLI / TUI wiring layer</text>
  <text class="small" x="780" y="316" text-anchor="middle">agentkit + swarm + graph + work + viz</text>

  <!-- Adapter nodes -->
  <rect class="node" x="1180" y="130" width="360" height="82" rx="14" ry="14" />
  <text class="label" x="1360" y="163" text-anchor="middle">agentkit / core modules</text>
  <text class="small" x="1360" y="186" text-anchor="middle">agent, llm, tools, cli, app, roles, trace</text>

  <rect class="node" x="1180" y="240" width="360" height="82" rx="14" ry="14" />
  <text class="label" x="1360" y="273" text-anchor="middle">ctxman</text>
  <text class="small" x="1360" y="296" text-anchor="middle">session, storage, rendering, gc</text>

  <rect class="node" x="1180" y="350" width="360" height="82" rx="14" ry="14" />
  <text class="label" x="1360" y="383" text-anchor="middle">graph</text>
  <text class="small" x="1360" y="406" text-anchor="middle">access, model, store, tools, write</text>

  <rect class="node" x="1180" y="460" width="360" height="82" rx="14" ry="14" />
  <text class="label" x="1360" y="493" text-anchor="middle">swarm</text>
  <text class="small" x="1360" y="516" text-anchor="middle">runtime, dynamic, completion, tools</text>

  <rect class="node" x="1180" y="570" width="360" height="82" rx="14" ry="14" />
  <text class="label" x="1360" y="603" text-anchor="middle">work</text>
  <text class="small" x="1360" y="626" text-anchor="middle">runner, scheduler, executor, store, tools</text>

  <rect class="node" x="1180" y="680" width="360" height="82" rx="14" ry="14" />
  <text class="label" x="1360" y="713" text-anchor="middle">viz</text>
  <text class="small" x="1360" y="736" text-anchor="middle">server, api, trace, model, project</text>

  <!-- Dependency edges: routed around app node via corridors -->
  <!-- core dep / feature edges -->
  <path class="edge" d="M 370 166 C 520 166, 570 190, 610 250" />
  <path class="edge" d="M 370 286 C 500 286, 560 282, 610 286" />
  <path class="edge edge-dashed" d="M 370 426 C 500 426, 560 330, 610 302" />
  <path class="edge edge-dashed" d="M 370 556 C 500 556, 560 350, 610 310" />
  <path class="edge edge-dashed" d="M 370 806 C 500 806, 560 410, 610 318" />

  <!-- agentkit -> adapter block -->
  <path class="edge" d="M 370 166 C 760 166, 980 166, 1180 171" />
  <path class="edge" d="M 370 166 C 760 166, 980 276, 1180 281" />
  <path class="edge" d="M 370 166 C 760 166, 980 386, 1180 391" />
  <path class="edge" d="M 370 166 C 760 166, 980 496, 1180 501" />
  <path class="edge" d="M 370 166 C 760 166, 980 606, 1180 611" />
  <path class="edge" d="M 370 166 C 760 166, 980 716, 1180 721" />

  <!-- app wiring edges: orthogonal start, then outer routing, avoiding node overlap -->
  <path class="edge edge-soft" d="M 610 258 L 565 258 C 485 258, 455 426, 370 426" />
  <path class="edge edge-soft" d="M 610 286 L 565 286 C 485 286, 455 556, 370 556" />
  <path class="edge edge-soft" d="M 610 314 L 565 314 C 485 314, 455 676, 370 676" />
  <path class="edge edge-soft" d="M 610 342 L 565 342 C 485 342, 455 806, 370 806" />

  <path class="edge edge-soft" d="M 950 258 L 1000 258 C 1070 258, 1090 171, 1180 171" />
  <path class="edge edge-soft" d="M 950 314 L 1000 314 C 1070 314, 1090 281, 1180 281" />

  <!-- Legend -->
  <rect x="1040" y="850" width="580" height="180" rx="16" ry="16" fill="#10172b" stroke="#2b3557" />
  <text class="label" x="1070" y="885">Legende</text>
  <line class="edge" x1="1070" y1="915" x2="1150" y2="915" />
  <text class="legend" x="1165" y="920">Crate-Abhängigkeit</text>
  <line class="edge edge-soft" x1="1070" y1="950" x2="1150" y2="950" />
  <text class="legend" x="1165" y="955">Explizite Verdrahtung / Re-Export</text>
  <line class="edge edge-dashed" x1="1070" y1="985" x2="1150" y2="985" />
  <text class="legend" x="1165" y="990">optionale / feature-gesteuerte Verbindung</text>
</svg>