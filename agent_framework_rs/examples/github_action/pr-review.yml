# PR-Review mit agentkit: bei jedem Pull Request ein Review als Kommentar.
# Nach .github/workflows/ kopieren und das Secret ANTHROPIC_API_KEY anlegen.
name: agentkit-review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # der Agent braucht die Basis für git_diff

      - uses: rudi77/agentkit_rs@main
        with:
          provider: anthropic
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Nur lesen: Git-Tools und read_file brauchen keine Shell.
          allow-shell: "false"
          token-limit: "400000"
          comment: "true"
          prompt: |
            Reviewe den Pull Request: die Änderungen origin/${{ github.base_ref }}..HEAD
            (git_diff mit range). Lies betroffene Dateien für Kontext. Melde nur echte
            Probleme — Fehler, Sicherheitslücken, fehlende Tests — jeweils mit Datei,
            Zeile und Begründung. Antworte als Markdown-Liste; ohne Befund schreibe
            "Keine Einwände."
