# Veröffentlicht die Produkt-Website aus `website/` über GitHub Pages.
#
# Voraussetzung (einmalig, in den Repo-Einstellungen): Settings → Pages →
# „Build and deployment" → Source = „GitHub Actions". Solange das fehlt,
# scheitert `configure-pages` mit „Get Pages site failed … Not Found". Die
# Action könnte Pages per `enablement: true` selbst einschalten, braucht dafür
# aber ein Token jenseits von GITHUB_TOKEN (PAT mit `repo`-Scope) — der eine
# Klick in den Einstellungen ist billiger als ein Secret. Danach liegt die
# Seite unter https://rudi77.github.io/agentkit_rs/ — die Website ist reines
# HTML/CSS, es gibt keinen Build-Schritt; der Workflow lädt nur hoch.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
