name: release

# Baut bei jedem Versions-Tag (z. B. v0.11.0) eigenständige agentkit-Executables für
# Windows & Linux und hängt sie an den GitHub-Release. Manuell auslösbar via
# "Run workflow": ohne `tag`-Input nur Artefakte; mit `tag`-Input (z. B. v0.12.0)
# legt die Release-Action Tag + Release auf dem gewählten Ref selbst an — für
# Umgebungen, aus denen kein Tag gepusht werden kann.
#
# Zwei Varianten pro Plattform — derselbe Agent-Kern, nur ein anderer Feature-Satz:
#
#   voll  (`tui pdf ctxman graph work viz`) : inkl. Terminal-UI (`agentkit --tui`) — der interaktive Alltag.
#   cli   (`pdf ctxman graph work viz`)     : ohne ratatui, spürbar schlanker — für Skripte, Pipelines
#                              und CI, wo das UI nie startet. Verhält sich sonst identisch
#                              (One-shot, REPL, --format json, Exit-Codes, read-pdf).
#
# Seit v0.13.1 ist `ctxman` (volles Context-Management: --ctx DIR, Watermark-GC,
# expand_context_ref, Snapshot-Resume) in BEIDEN Varianten enthalten.
#
# `graph` (Wissensgraph aus agentkit_graph: --graph DIR, graph_search/-remember/
# -promote, gemeinsames Gedächtnis auch für Schwarm-Mitglieder) ist ebenfalls in
# BEIDEN drin: das Crate ist reines Rust ohne Speicher-Dependency, braucht also
# keine C-Toolchain im Release-Build. Gemessen kostet es 323 KB (12,19 -> 12,51 MB
# in der cli-Variante, Linux x86_64) — der Preis für ein Gedächtnis über Sessions
# hinweg.
#
# `work` (persistente Arbeits-Runtime aus agentkit_work: `agentkit work create|run|
# status|resume`, Work Items mit Abhängigkeiten, Leases, Journal und Wiederaufnahme)
# ist ebenfalls in BEIDEN drin — dieselbe Begründung wie bei `graph`: reines Rust,
# keine Speicher-Dependency, also keine C-Toolchain im Release-Build. Ohne das
# Feature kennt das Binary das Verb `work` nicht.
#
# `viz` (der Betrachter aus agentkit_viz: `agentkit viz` liest den `--trace`-NDJSON
# und zeigt Kontext/Verlauf/Schwarm/Graph/Work auf localhost als JSON plus eine
# eingebettete HTML-Seite) ist seit dieser Version ebenfalls in BEIDEN drin. Bis
# auf `tiny_http` (synchron, kein TLS) reines Rust — also keine C-Toolchain im
# Release-Build. Ohne das Feature kennt das Binary das Verb `viz` nicht.
#
# `pdf` ist in BEIDEN drin: `agentkit read-pdf` ist gerade in der Automatisierung
# das deterministische Werkzeug (siehe examples/accounts_payable).
#
# Seit v0.12.0 ist der Release rein Rust und enthält zusätzlich ctxman_rs — den
# Context-Management-Kern als eigenständige Bibliothek. ctxman hat kein Binary,
# darum wandert das Crate als `cargo package`-Archiv (.crate) in den Release.
#
# Seit v0.13.0 liegt außerdem `agentkit-examples.zip` bei: die kompletten
# Beispiele (accounts_payable, pr_review inkl. ADO-Reviewer-Skript, coding_swarm,
# logwatch, win_triage, …) zum Entpacken neben einer installierten Binary.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag (z. B. v0.12.0). Leer = nur Artefakte, kein Release."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.variant }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            variant: voll
            features: "tui pdf ctxman tiktoken graph work viz"
            asset: agentkit-linux-x86_64
          - os: windows-latest
            variant: voll
            features: "tui pdf ctxman tiktoken graph work viz"
            asset: agentkit-windows-x86_64.exe
          - os: ubuntu-latest
            variant: cli
            features: "pdf ctxman tiktoken graph work viz"
            asset: agentkit-cli-linux-x86_64
          - os: windows-latest
            variant: cli
            features: "pdf ctxman tiktoken graph work viz"
            asset: agentkit-cli-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Rust-Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --manifest-path agentkit_app/Cargo.toml --bin agentkit --features "${{ matrix.features }}"

      - name: Binary einsammeln
        shell: bash
        run: |
          mkdir -p staging
          if [ "${{ runner.os }}" = "Windows" ]; then
            src="agentkit_app/target/release/agentkit.exe"
          else
            src="agentkit_app/target/release/agentkit"
          fi
          cp "$src" "staging/${{ matrix.asset }}"
          ls -la staging

      # Rauchtest ohne Netz/Key — beweist, dass die Binary startet und der Loop läuft.
      - name: Smoke-Test
        shell: bash
        run: ./staging/${{ matrix.asset }} --demo "Was ist 17 + 25?"

      # ctxman muss enthalten sein: ohne das Feature quittiert `--ctx` nur mit
      # einer Warnung — genau die darf nicht auftauchen, und der Snapshot muss da sein.
      - name: ctxman ist enthalten
        shell: bash
        run: |
          set -e
          out="$(./staging/${{ matrix.asset }} --demo --ctx ctx-smoke "Was ist 2 + 2?" 2>&1 </dev/null)"
          if echo "$out" | grep -q "ohne Feature"; then
            echo "$out"; echo "FEHLER: Binary ohne ctxman gebaut"; exit 1
          fi
          ls ctx-smoke/
          echo "ok: ctxman aktiv"

      # Das `swarm`-Tool (dynamische Agenten-Schwärme aus agentkit-swarm) muss in
      # BEIDEN Varianten im Werkzeugkasten stehen. `/tools` baut den Agenten und
      # listet die Registry, ohne das Modell zu befragen — der Dummy-Key sorgt nur
      # dafür, dass nicht der Demo-Modus greift (der hat keinen Coding-Agenten).
      - name: swarm-Tool ist enthalten
        shell: bash
        env:
          OPENAI_API_KEY: sk-smoketest
          OPENAI_MODEL: gpt-4o
        run: |
          set -e
          mkdir -p swarm-smoke
          out="$(printf '/tools\n/exit\n' | ./staging/${{ matrix.asset }} --repl -w swarm-smoke 2>&1)"
          echo "$out"
          echo "$out" | grep -q "swarm" || { echo "FEHLER: kein swarm-Tool im Build"; exit 1; }
          echo "ok: swarm-Tool aktiv"

      # Der Wissensgraph (agentkit-graph) muss in BEIDEN Varianten drin sein: ohne das
      # Feature quittiert `--graph` nur mit einer Warnung. `/tools` listet die Registry,
      # ohne das Modell zu befragen — und weil das Binary die Graph-Tools auch im
      # Demo-Modus registriert, braucht dieser Test im Gegensatz zum swarm-Test keinen Key.
      - name: Wissensgraph ist enthalten
        shell: bash
        run: |
          set -e
          out="$(printf '/tools\n/exit\n' | ./staging/${{ matrix.asset }} --demo --graph graph-smoke --repl 2>&1)"
          echo "$out"
          if echo "$out" | grep -q "ohne Feature"; then
            echo "FEHLER: Binary ohne graph gebaut"; exit 1
          fi
          echo "$out" | grep -q "graph_search" || { echo "FEHLER: keine Graph-Tools im Build"; exit 1; }
          echo "$out" | grep -q "graph_remember" || { echo "FEHLER: kein graph_remember im Build"; exit 1; }
          echo "ok: Wissensgraph aktiv"

      # Die Arbeits-Runtime (agentkit-work) muss in BEIDEN Varianten drin sein: ohne
      # das Feature kennt das Binary das Verb `work` gar nicht und würde es als
      # Auftragstext an das Modell schicken. `work --help` ist der billigste Nachweis
      # — kein Modellaufruf, kein Key, kein Projektverzeichnis.
      - name: Arbeits-Runtime ist enthalten
        shell: bash
        run: |
          set -e
          out="$(./staging/${{ matrix.asset }} work --help 2>&1 </dev/null)"
          echo "$out"
          # Gegen die TATSÄCHLICHE Ausgabe von HELP_TEXT (agentkit_work/src/cli.rs)
          # prüfen: die Unterkommandos stehen dort eingerückt ("create --title …"),
          # nicht als "work create". Muster hier immer gegen die echte Hilfe
          # gegenprüfen, sonst schlägt der Release-Bau an einer Formulierung fehl.
          echo "$out" | grep -q "agentkit work <unterkommando>" || { echo "FEHLER: Binary ohne work gebaut"; exit 1; }
          echo "$out" | grep -q "create --title" || { echo "FEHLER: work-CLI unvollständig (create fehlt)"; exit 1; }
          echo "$out" | grep -q "resume <projekt-id>" || { echo "FEHLER: work-CLI unvollständig (resume fehlt)"; exit 1; }
          echo "ok: Arbeits-Runtime aktiv"

      # Der Betrachter (agentkit-viz) muss in BEIDEN Varianten drin sein: ohne das
      # Feature quittiert `agentkit viz` mit "enthält den Betrachter nicht" und
      # Exit 1. Mit dem Feature druckt der viz-Pfad "» Trace-Verzeichnis:" auf
      # stderr, BEVOR der Server bindet und blockiert — genau dieser Marker ist der
      # nicht-blockierende Nachweis. Deshalb im Hintergrund starten, kurz warten,
      # den Marker prüfen und den Prozess wieder beenden.
      - name: Betrachter ist enthalten
        shell: bash
        run: |
          set -e
          mkdir -p viz-smoke
          ./staging/${{ matrix.asset }} viz -w viz-smoke > viz.out 2>&1 &
          pid=$!
          for i in $(seq 1 20); do
            if grep -q "Trace-Verzeichnis" viz.out 2>/dev/null; then break; fi
            sleep 0.5
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat viz.out
          if grep -q "enthält den Betrachter nicht" viz.out; then
            echo "FEHLER: Binary ohne viz gebaut"; exit 1
          fi
          grep -q "Trace-Verzeichnis" viz.out || { echo "FEHLER: kein viz im Build"; exit 1; }
          echo "ok: Betrachter aktiv"

      # Die schlanke Variante darf kein TUI enthalten — sonst wäre sie versehentlich
      # doch die volle und der Zweck (kleines Automatisierungs-Binary) dahin. Ohne das
      # Feature weist `--tui` sich selbst ab ("Dieses Build enthält kein TUI") und
      # kehrt sofort zurück; die volle Variante würde hier ein UI starten und hängen,
      # deshalb wird nur die cli-Variante geprüft.
      - name: cli-Variante ist wirklich ohne TUI
        if: matrix.variant == 'cli'
        shell: bash
        run: |
          set -e
          out="$(./staging/${{ matrix.asset }} --tui 2>&1 </dev/null)"
          echo "$out"
          echo "$out" | grep -q "kein TUI" || { echo "FEHLER: cli-Variante enthält doch ein TUI"; exit 1; }
          echo "ok: cli-Variante weist --tui ab"

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: staging/${{ matrix.asset }}
          if-no-files-found: error

  # ctxman_rs — der Context-Management-Kern als eigenständige Bibliothek. Kein
  # Binary, daher Tests (Default + Feature `http`) und ein `cargo package`-Archiv,
  # das mit in den Release wandert.
  ctxman:
    name: ctxman_rs (Tests + Paket)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust-Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Tests (Default-Features)
        run: cargo test --manifest-path ctxman_rs/Cargo.toml

      - name: Tests (Feature http)
        run: cargo test --manifest-path ctxman_rs/Cargo.toml --features http

      # `cargo package` verifiziert das Crate (baut es aus dem Archiv neu) und
      # erzeugt ctxman_rs/target/package/ctxman-<version>.crate.
      - name: Crate paketieren
        run: cargo package --manifest-path ctxman_rs/Cargo.toml

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ctxman-crate
          path: ctxman_rs/target/package/*.crate
          if-no-files-found: error

  # agentkit_swarm — der Actor-basierte Schwarm auf agentkit. Kein Binary und
  # (wegen der Pfad-Abhängigkeit auf agentkit) kein `cargo package`; hier laufen
  # nur die Offline-Tests plus ein Kompile-Check der Feature-Weiterleitung.
  swarm:
    name: agentkit_swarm (Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust-Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Tests (offline, Default-Features)
        run: cargo test --manifest-path agentkit_swarm/Cargo.toml

      - name: Build (Features openai + ctxman)
        run: cargo build --manifest-path agentkit_swarm/Cargo.toml --features "openai ctxman"

  # agentkit_work — die persistente Arbeits-Runtime. Wie der Schwarm: kein Binary,
  # kein `cargo package` (Pfad-Abhängigkeit auf agentkit); hier laufen die
  # Offline-Tests, ein Kompile-Check der Feature-Weiterleitung und die Verdrahtung
  # im Binary-Crate.
  work:
    name: agentkit_work (Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust-Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Tests (offline, Default-Features)
        run: cargo test --manifest-path agentkit_work/Cargo.toml

      - name: Build (Features openai + ctxman)
        run: cargo build --manifest-path agentkit_work/Cargo.toml --features "openai ctxman"

      - name: Verdrahtung im Binary-Crate
        run: cargo test --manifest-path agentkit_app/Cargo.toml --no-default-features --features work

  # Sammelt alle Binaries und hängt sie an den Release — bei Tag-Pushes und bei
  # manuellen Läufen mit gesetztem `tag`-Input (dann erzeugt die Action den Tag).
  release:
    name: GitHub Release
    needs: [build, ctxman, swarm, work]
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != '' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tag bestimmen: Tag-Push → der Tag selbst; Dispatch → der Input;
      # Branch-Push → v<version> aus agentkit_app/Cargo.toml (dem Binary-Crate).
      - name: Release-Tag bestimmen
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="v$(grep -m1 '^version' agentkit_app/Cargo.toml | cut -d'"' -f2)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Artefakte herunterladen
        if: startsWith(github.ref, 'refs/tags/') || steps.tag.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Beispiele als installierbares Paket: neben eine Binary entpacken, fertig.
      # Unversionierter Asset-Name, damit der `releases/latest/download/…`-Pfad
      # (Setup-Skript, INSTALL.md) funktioniert; die Version steht IM Archiv.
      - name: Beispiele paketieren
        if: startsWith(github.ref, 'refs/tags/') || steps.tag.outputs.exists == 'false'
        shell: bash
        run: |
          cd agent_framework_rs
          echo "${{ steps.tag.outputs.tag }}" > examples/VERSION
          zip -r "../artifacts/agentkit-examples.zip" examples \
            -x "examples/**/__pycache__/*"
          unzip -l "../artifacts/agentkit-examples.zip" | tail -3

      # Beim Branch-Push wird nur released, wenn der Tag noch nicht existiert —
      # sonst würde jeder weitere Push denselben Release anfassen.
      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/') || steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          generate_release_notes: true
